services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/finance.db
      - BACKUP_DIR=/app/backups
    volumes:
      - finance_data:/app/data
      - finance_backups:/app/backups

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    # O nginx resolve o host "backend" ao iniciar e cai se ele nao existir;
    # espera o healthcheck do backend (definido no Dockerfile) passar.
    depends_on:
      backend:
        condition: service_healthy

# Nomes fixos (herdados do antigo projeto compose "xxx"). O banco atual ja
# vive nestes volumes: nao renomear, senao o compose cria volumes novos e
# sobe com um banco vazio.
volumes:
  finance_data:
    name: xxx_finance_data
  finance_backups:
    name: xxx_finance_backups
