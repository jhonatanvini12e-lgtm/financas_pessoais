version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/finance.db
      - BACKUP_DIR=/app/backups
    volumes:
      - finance_data:/app/data
      - finance_backups:/app/backups

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

# Nomes fixos: os volumes foram criados quando o projeto ficava em
# Documentos/xxx (projeto compose "xxx"). Sem `name`, o compose prefixa com o
# nome da pasta atual e sobe com um banco novo e vazio em vez do existente.
volumes:
  finance_data:
    name: xxx_finance_data
  finance_backups:
    name: xxx_finance_backups
